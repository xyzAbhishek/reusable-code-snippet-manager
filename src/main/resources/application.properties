spring.application.name=reusable-code-snippet-manager
server.port=8080

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/snippet_manager_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Initialize Seed Data
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

# Two-Way GitHub Repository Sync Configuration
github.sync.enabled=${GITHUB_SYNC_ENABLED:false}
github.token=${GITHUB_TOKEN:}
github.repo.owner=${GITHUB_REPO_OWNER:}
github.repo.name=${GITHUB_REPO_NAME:}
github.repo.branch=${GITHUB_REPO_BRANCH:main}
github.webhook.secret=${GITHUB_WEBHOOK_SECRET:}
