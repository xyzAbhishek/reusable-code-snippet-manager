version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: snippet-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: snippet_manager_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: snippet_user
      MYSQL_PASSWORD: snippet_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/2-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  snippet-app:
    build: .
    container_name: snippet-manager-app
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/snippet_manager_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: snippet_user
      SPRING_DATASOURCE_PASSWORD: snippet_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  mysql_data:
